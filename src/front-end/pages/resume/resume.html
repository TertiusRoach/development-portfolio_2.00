<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--🠋 Tab Icon 🠋-->
    <link rel="shortcut icon" href="dist/front-end/pages/resume/content/svg-files/signature-icon/primary-light.svg" />

    <!--🠋 Font CDN: a <link>, because gulp puts Bootstrap first and an @import below it is ignored 🠋-->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    />
    <link defer href="dist/front-end/pages/resume/style.css" type="text/css" rel="stylesheet" />
    <!--🠊 <script defer src="dist/back-end/back-end.js" type="text/javascript"></script> 🠈-->
    <script
      defer
      src="dist/front-end/vendors/RequireJS.js"
      type="text/javascript"
      data-main="dist/front-end/front-end"
    ></script>

    <title>Résumé</title>
  </head>
  <body id="resume-body" class="loading-body">
    <!--🠉 style="display: grid" 🠉-->
    <!--🠊 class="loading-body" 🠈-->
    <style>
      .loading-body {
        display: grid;
        height: 100vh;
        grid-template-rows: 1fr;
        grid-template-columns: 1fr;
        background: radial-gradient(circle, rgba(31, 49, 49, 1) 25%, rgba(61, 98, 98, 1) 100%, rgba(158, 176, 176, 1) 100%);
      }
      .loading-body main {
        grid-row-end: 2;
        grid-row-start: 1;
        grid-column-end: 2;
        grid-column-start: 1;
      }
      body main {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      body main img {
        height: auto;
        max-width: 100%;
        filter: drop-shadow(0 0 1rem black);
      }
    </style>
    <main>
      <img
        width="1280"
        height="720"
        src="dist/front-end/pages/resume/content/gif-files/1280x720, 15fps/signature-light.gif"
        alt="Loading Screen"
      />
    </main>
    <script></script>
  </body>
</html>
